[package]
name = "uuob-app"
# UUOB's version: the Mac app (mac/build.sh), the Android app (android/app/build.gradle.kts)
# and its updates (src/update.rs) all read it from here.
version = "0.5.1"
edition.workspace = true
license.workspace = true

[lib]
name = "uuob_app"
# The Mac and Android apps load it as a shared library (libuuob_app.dylib, .so).
crate-type = ["cdylib", "rlib"]

[[bin]]
# Writes the Swift and Kotlin bindings (UniFFI) from the built library:
#   cargo run -p uuob-app --features bindgen --bin uniffi-bindgen -- generate --library <lib> --language swift|kotlin --out-dir <dir>
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "0.32"
thiserror = "2"
uuob-core = { path = "../uuob-core" }
uuob-api = { path = "../uuob-api" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Updates: the same feed and signatures as the apps' (crates/uuob-update/src/feed.rs).
ureq = "3"
semver = "1"
minisign-verify = "0.2"
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Computers: apps' alerts, rung by UUOB itself (Android rings them in Alerts.kt).
notify-rust = "4"
jiff = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The Mac app's update: a signed .app.tar.gz.
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
minisign = "0.7"
