[workspace]
resolver = "3"
members = ["crates/*", "linux"]
# The SDK (sdk/, a submodule) is its own workspace; UUOB takes only its kit.
exclude = ["sdk"]
# The Linux window needs GTK 4 and Libadwaita (docker/linux.Dockerfile); plain
# `cargo build` and `cargo test` leave it out.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

# Argon2 (pairing codes) and crypto are slow unoptimized; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 2
