# Builds this repository's Mac app for Apple silicon: UUOB's native
# app (mac/build.sh) when there is a mac/ folder, otherwise the Tauri app in
# `app/`. The same file serves UUOB and each app that uses it.
# Run it from the Actions tab or with `gh workflow run mac.yml`; release.sh
# does that when publishing a new version.
# It leaves a .dmg (first install) and a .app.tar.gz (what the app's own
# Update button installs, see crates/uuob-update).
name: macOS app
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - uses: actions/setup-node@v7
        if: hashFiles('mac/build.sh') == ''
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        if: hashFiles('mac/build.sh') == ''
      - name: Build the native app
        if: hashFiles('mac/build.sh') != ''
        run: mac/build.sh
      - name: Screenshots of the native app
        if: hashFiles('mac/build.sh') != ''
        continue-on-error: true
        run: |
          # Demo data (a few apps, an AI, a person, a storage device): each screen once, light and dark.
          cargo run -q -p uuob-core --example seed -- "$RUNNER_TEMP/uuob"
          for mode in light dark; do
            [ $mode = dark ] && osascript -e 'tell app "System Events" to tell appearance preferences to set dark mode to true' || true
            for s in network access settings; do
              UUOB_DATA_DIR="$RUNNER_TEMP/uuob" UUOB_SCREEN=$s mac/build/UUOB.app/Contents/MacOS/UUOB & pid=$!
              # Escape: "Later" for the demo's share offer, and no to the runner's local network prompt.
              sleep 8; for k in 1 2; do osascript -e 'tell application "System Events" to key code 53' || true; sleep 1; done
              screencapture -x "out/shot-$mode-$s.png"; kill $pid; sleep 1
            done
          done
      - name: Build the app
        if: hashFiles('mac/build.sh') == ''
        run: |
          bundle=target/aarch64-apple-darwin/release/bundle
          (cd app && npx tauri build --target aarch64-apple-darwin --bundles app,dmg)
          mkdir -p out
          cp "$bundle"/dmg/*.dmg out/
          (cd "$bundle/macos" && for a in *.app; do COPYFILE_DISABLE=1 tar -czf "$GITHUB_WORKSPACE/out/$a.tar.gz" "$a"; done)
          ls -la out
      - uses: actions/upload-artifact@v7
        with: { name: mac, path: out/*, if-no-files-found: error }
