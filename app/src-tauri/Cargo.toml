[package]
name = "uuob-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "uuob_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
uuob-core = { path = "../../crates/uuob-core" }
uuob-api = { path = "../../crates/uuob-api" }
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-uuob-update = { path = "../../crates/uuob-update" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# Computers: apps' alerts, rung by UUOB itself (Android rings them in Alerts.kt).
notify-rust = "4"
jiff = "0.2"

# Android: the background service and the "start when the phone turns on" switch.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
# Embed the built frontend (dist/) instead of loading the Vite dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
