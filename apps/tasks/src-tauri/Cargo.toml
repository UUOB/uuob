[package]
name = "uuob-tasks"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "uuob_tasks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The update address in tauri.conf.json is embedded as JSON.
serde_json = "1"
tauri-plugin-uuob-update = { path = "../../../crates/uuob-update" }
tauri-plugin-uuob-sdk = { path = "../../../crates/uuob-sdk" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
